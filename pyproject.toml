[project]
name = "montreal-cinema-calendar"
version = "1.0.0"
description = "Automated iCalendar feed for independent Montreal cinemas, microcinemas and film festivals"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "python-dateutil>=2.9,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "icalendar>=6,<7"]

[project.scripts]
montreal-cinema-calendar = "montreal_cinema_calendar.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

